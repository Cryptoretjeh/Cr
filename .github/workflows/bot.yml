name: Telegram Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Diperbarui dari v3 ke v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Diperbarui dari v4 ke v5
        with:
          python-version: '3.10'     # Diperbarui dari 3.9 ke 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        run: python bot.py
