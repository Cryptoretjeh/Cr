name: Telegram Bot

on:
  push:
    branches: [ main ]
    schedule:
    # Berjalan setiap 5 jam sekali untuk memastikan bot tidak mati
    - cron: '0 */5 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        run: python bot.py
